<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 380" width="1200" height="380">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140c26"/>
      <stop offset="0.55" stop-color="#34193d"/>
      <stop offset="1" stop-color="#6e2a43"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#ff7a6b"/>
      <stop offset="1" stop-color="#d7263d"/>
    </radialGradient>
    <linearGradient id="fuji" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1d45"/>
      <stop offset="1" stop-color="#170f2a"/>
    </linearGradient>
    <pattern id="wave" width="40" height="20" patternUnits="userSpaceOnUse">
      <g fill="#131c36" stroke="#5f8fb8" stroke-width="1.1" stroke-opacity="0.7">
        <circle cx="0" cy="10" r="19"/><circle cx="0" cy="10" r="13"/><circle cx="0" cy="10" r="7"/>
        <circle cx="40" cy="10" r="19"/><circle cx="40" cy="10" r="13"/><circle cx="40" cy="10" r="7"/>
        <circle cx="20" cy="20" r="19"/><circle cx="20" cy="20" r="13"/><circle cx="20" cy="20" r="7"/>
      </g>
    </pattern>
    <clipPath id="card"><rect width="1200" height="380" rx="20"/></clipPath>
    <path id="petal" d="M0,-8 C6,-8 8,-1 0,8 C-8,-1 -6,-8 0,-8 Z"/>
    <style>
      .jp { font-family: 'Noto Serif JP','Yu Mincho','Hiragino Mincho ProN','MS Mincho',serif; }
      .en { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; }
      .p { fill:#f7b6c8; opacity:.9; transform-box: fill-box; transform-origin: center;
           animation: fall 11s linear infinite; }
      .p.b { fill:#fbd3de; animation-duration: 14s; }
      @keyframes fall {
        0%   { transform: translate(0,-30px) rotate(0deg); opacity:0; }
        10%  { opacity:.95; }
        90%  { opacity:.9; }
        100% { transform: translate(-220px,430px) rotate(540deg); opacity:0; }
      }
      .tw { animation: tw 4s ease-in-out infinite; }
      @keyframes tw { 0%,100%{opacity:.25} 50%{opacity:1} }
      .sun { animation: glow 6s ease-in-out infinite; }
      @keyframes glow { 0%,100%{opacity:.92} 50%{opacity:1} }
      .ink { stroke-dasharray: 420; stroke-dashoffset: 420; animation: draw 2.4s ease-out .3s forwards; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="url(#sky)"/>

    <!-- stars -->
    <g fill="#fbe4ea">
      <circle class="tw" cx="420" cy="40" r="1.4"/>
      <circle class="tw" cx="520" cy="90" r="1" style="animation-delay:-1s"/>
      <circle class="tw" cx="610" cy="30" r="1.6" style="animation-delay:-2s"/>
      <circle class="tw" cx="700" cy="70" r="1" style="animation-delay:-3s"/>
      <circle class="tw" cx="980" cy="45" r="1.2" style="animation-delay:-1.5s"/>
      <circle class="tw" cx="1100" cy="150" r="1" style="animation-delay:-2.5s"/>
      <circle class="tw" cx="470" cy="150" r="1.1" style="animation-delay:-.5s"/>
    </g>

    <!-- rising sun with stripes -->
    <circle class="sun" cx="830" cy="190" r="125" fill="url(#sun)"/>
    <g fill="#4a2140">
      <rect x="690" y="215" width="280" height="5"/>
      <rect x="690" y="235" width="280" height="8"/>
      <rect x="690" y="258" width="280" height="11"/>
      <rect x="690" y="284" width="280" height="15"/>
    </g>

    <!-- far hills -->
    <path d="M380,330 Q470,280 560,300 T740,295 T920,300 T1200,285 L1200,380 L380,380 Z" fill="#241634" opacity=".85"/>
    <!-- Fuji -->
    <path d="M600,332 L770,208 Q830,178 890,208 L1060,332 Z" fill="url(#fuji)"/>
    <path d="M770,208 Q830,178 890,208 L862,232 L845,220 L828,238 L812,222 L795,236 Z" fill="#f3e9f0"/>

    <!-- torii -->
    <g fill="#d7263d" transform="translate(1085,238)">
      <path d="M-40,0 Q0,-8 40,0 L42,6 Q0,-2 -42,6 Z"/>
      <rect x="-34" y="12" width="68" height="5"/>
      <rect x="-27" y="4" width="7" height="88"/>
      <rect x="20" y="4" width="7" height="88"/>
      <rect x="-3" y="6" width="6" height="8"/>
    </g>

    <!-- seigaiha sea -->
    <rect x="0" y="318" width="1200" height="62" fill="url(#wave)"/>
    <rect x="0" y="318" width="1200" height="62" fill="#140c26" opacity=".25"/>

    <!-- sakura branch -->
    <g transform="translate(1200,0)">
      <path d="M0,20 C-80,30 -150,60 -210,110 M-120,45 C-140,20 -170,10 -200,12 M-170,80 C-185,95 -190,115 -188,135"
            stroke="#1a0f1f" stroke-width="6" fill="none" stroke-linecap="round"/>
      <g fill="#f7b6c8">
        <g transform="translate(-205,112)"><circle r="9"/><circle r="3" fill="#d7263d"/></g>
        <g transform="translate(-198,14)"><circle r="8"/><circle r="3" fill="#d7263d"/></g>
        <g transform="translate(-150,62)"><circle r="10"/><circle r="3" fill="#d7263d"/></g>
        <g transform="translate(-188,136)"><circle r="7"/><circle r="2.5" fill="#d7263d"/></g>
        <g transform="translate(-95,32)"><circle r="8"/><circle r="3" fill="#d7263d"/></g>
        <g transform="translate(-60,18)"><circle r="6"/></g>
        <g transform="translate(-130,36)"><circle r="6" fill="#fbd3de"/></g>
      </g>
    </g>

    <!-- falling petals -->
    <g transform="translate(1000,0)"><use href="#petal" xlink:href="#petal" class="p"/></g>
    <g transform="translate(1120,20)"><use href="#petal" xlink:href="#petal" class="p b" style="animation-delay:-3s"/></g>
    <g transform="translate(880,0)"><use href="#petal" xlink:href="#petal" class="p" style="animation-delay:-6s"/></g>
    <g transform="translate(760,10)"><use href="#petal" xlink:href="#petal" class="p b" style="animation-delay:-8s"/></g>
    <g transform="translate(640,0)"><use href="#petal" xlink:href="#petal" class="p" style="animation-delay:-4.5s"/></g>
    <g transform="translate(520,0)"><use href="#petal" xlink:href="#petal" class="p b" style="animation-delay:-10s"/></g>
    <g transform="translate(1180,40)"><use href="#petal" xlink:href="#petal" class="p" style="animation-delay:-1.5s"/></g>

    <!-- text block -->
    <text x="70" y="150" class="jp" font-size="92" font-weight="700" fill="#fbe4ea" letter-spacing="6">キリル</text>
    <path class="ink" d="M72,176 C160,168 260,184 380,172" stroke="#d7263d" stroke-width="5" fill="none" stroke-linecap="round"/>
    <text x="72" y="216" class="en" font-size="26" font-weight="600" fill="#f7b6c8" letter-spacing="8">KIM KIRILL</text>
    <text x="72" y="250" class="en" font-size="17" fill="#d9c3d6" letter-spacing="2">WordPress · Frontend · UI/UX</text>

    <!-- hanko stamp -->
    <g transform="translate(72,272) rotate(-4)">
      <rect width="46" height="46" rx="6" fill="none" stroke="#d7263d" stroke-width="3"/>
      <text x="23" y="21" class="jp" font-size="15" fill="#d7263d" text-anchor="middle" font-weight="700">開発</text>
      <text x="23" y="39" class="jp" font-size="15" fill="#d7263d" text-anchor="middle" font-weight="700">者</text>
    </g>
    <text x="132" y="302" class="jp" font-size="16" fill="#bfa6bd" letter-spacing="4">コードは道 — код как путь</text>
  </g>
  <rect width="1199" height="379" x=".5" y=".5" rx="20" fill="none" stroke="#4a2a55"/>
</svg>
